name: Eval Gate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      dataset:
        description: Dataset id or JSON path to evaluate
        required: true
        default: seller-intelligence-v2
      suite:
        description: Eval suite
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - full
      models:
        description: Comma-separated model slugs from config/models.json
        required: true
        default: claude-sonnet-4.6,deepseek-v3.2
      baseline:
        description: Baseline model slug
        required: true
        default: claude-sonnet-4.6
      candidate:
        description: Candidate model slug
        required: true
        default: deepseek-v3.2
      upload_artifacts:
        description: Upload full eval artifact. Use only for synthetic or approved data.
        required: true
        default: false
        type: boolean

jobs:
  unit-tests:
    name: Secret-free checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Run judge + gate tests
        run: npm test
      - name: Build dashboard
        run: npm run build

  eval-gate:
    name: Manual AI Eval Quality Gate
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Require OpenRouter API key
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          test -n "$OPENROUTER_API_KEY" || {
            echo "OPENROUTER_API_KEY secret is required for manual live evals.";
            exit 1;
          }

      - name: Run live eval
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          node eval/eval-runner.js \
            --models "${{ inputs.models }}" \
            --baseline "${{ inputs.baseline }}" \
            --candidate "${{ inputs.candidate }}" \
            --dataset "${{ inputs.dataset }}" \
            --suite "${{ inputs.suite }}" \
            --output output/ci-results.json

      - name: Check gate verdict
        run: |
          node eval/check-gate.js output/ci-results.json \
            --baseline output/eval-results.json

      - name: Upload eval results artifact
        if: always() && inputs.upload_artifacts == true && vars.UPLOAD_EVAL_ARTIFACTS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-${{ github.sha }}
          path: output/ci-results.json
          retention-days: 30
