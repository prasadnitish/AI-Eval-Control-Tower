name: Eval Gate

on:
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Run judge + gate tests
        run: npm test

  eval-gate:
    name: AI Eval Quality Gate
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run smoke eval (baseline vs candidate)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          node eval/eval-runner.js \
            --models claude-sonnet-4.6,deepseek-v3.2 \
            --baseline claude-sonnet-4.6 \
            --candidate deepseek-v3.2 \
            --dataset seller-intelligence-v2 \
            --suite smoke \
            --output output/ci-results.json

      - name: Check gate verdict
        run: |
          node eval/check-gate.js output/ci-results.json \
            --baseline output/eval-results.json

      - name: Upload eval results artifact
        if: always() && vars.UPLOAD_EVAL_ARTIFACTS == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-${{ github.sha }}
          path: output/ci-results.json
          retention-days: 30
